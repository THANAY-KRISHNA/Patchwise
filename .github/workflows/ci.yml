name: Patchwise CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality-gates:
    name: Backend Tests & Benchmark Evaluation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Alembic Database Migrations (Static DDL)
        run: python -m alembic upgrade head --sql

      - name: Run Backend Pytest Suite
        run: python -m pytest -v

      - name: Run Offline Benchmark Evaluation (Python)
        run: python -m src.benchmark.runner --dataset python --provider none

      - name: Run Offline Benchmark Evaluation (JavaScript)
        run: python -m src.benchmark.runner --dataset javascript --provider none

      - name: Run Offline Benchmark Evaluation (Java)
        run: python -m src.benchmark.runner --dataset java --provider none

      - name: Run Offline Benchmark Evaluation (C/C++)
        run: python -m src.benchmark.runner --dataset cpp --provider none

      - name: Run Offline Benchmark Evaluation (SQL)
        run: python -m src.benchmark.runner --dataset sql --provider none

  frontend-quality-gates:
    name: Frontend Tests, Lint, Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Node.js Tests
        run: npm test

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Run Next.js Production Build
        run: npm run build
